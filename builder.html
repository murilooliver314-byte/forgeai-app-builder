<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeAI Studio</title><link rel="stylesheet" href="builder.css"></head>
<body>
<header class="top"><div class="brand"><b>✦</b> Forge<span>AI</span></div><div class="project"><strong id="projectName">Novo aplicativo</strong><i></i><small>Salvo agora</small></div><div class="top-actions"><button id="backBtn">← Projetos</button><button id="downloadBtn" class="primary">⇩ Baixar projeto</button><button id="publishBtn" class="primary">Publicar ↗</button></div></header>
<main class="workspace">
<aside class="files panel"><div class="panel-title"><strong>Arquivos</strong><button id="newFile">＋</button></div><div id="fileList"></div><div class="files-bottom"><span>☁</span> Projeto sincronizado</div></aside>
<section class="center"><div class="tabs"><button class="tab active" data-tab="code">Código</button><button class="tab" data-tab="preview">Preview</button><span></span><button id="deviceDesktop">▣ Desktop</button><button id="deviceMobile">▯ Mobile</button></div><div class="editor-wrap" id="editorWrap"><div class="line-numbers" id="lineNumbers">1</div><textarea id="codeEditor" spellcheck="false"></textarea></div><iframe id="preview" title="Preview do aplicativo"></iframe></section>
<aside class="assistant panel"><div class="assistant-head"><div class="ai-orb">✦</div><div><strong>Assistente ForgeAI</strong><small>Pronto para construir</small></div><span class="online"></span></div><div class="chat" id="chat"><div class="message ai"><b>Olá, Murilo! ✦</b><p>Descreva uma alteração ou peça uma nova função para o seu aplicativo.</p></div><div class="quick"><button data-quick="Deixe o visual mais moderno e profissional">Modernizar visual</button><button data-quick="Adicione uma seção de contato com WhatsApp">Adicionar contato</button><button data-quick="Crie uma seção de depoimentos de clientes">Adicionar depoimentos</button></div></div><form class="chat-form" id="chatForm"><textarea id="chatInput" placeholder="Ex.: adicione um botão de WhatsApp..." rows="2"></textarea><button>↑</button></form><div class="credits">✦ 98 créditos restantes</div></aside>
</main><div class="statusbar"><span><i></i> Sistema pronto</span><span id="statusText">Código gerado localmente</span></div><script src="builder.js"></script></body></html>
